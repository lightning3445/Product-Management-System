{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Login - Product Manager</title>

    <link rel="stylesheet"
          href="{% static 'product/style.css' %}">

</head>

<body>


<div class="login-page">


    <div class="login-container">


        <h1>
            Product Manager
        </h1>


        <p class="login-subtitle">
            Login to manage your products
        </p>


        <form method="POST">

            {% csrf_token %}


            <div class="login-field">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="login-field">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                Login
            </button>


        </form>


    </div>


</div>


</body>
</html>
